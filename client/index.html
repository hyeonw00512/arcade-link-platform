<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07111f">
  <meta name="description" content="어디서든 같은 방에서 만나는 실시간 멀티게임 플랫폼">
  <title>Arcade Link</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div id="app" class="app-shell" aria-live="polite"></div>
  <div id="toast" class="toast" role="status"></div>
  <div id="ui-layer" class="ui-layer" aria-live="polite"></div>
  <script src="/runtime-config.js"></script>
  <script>
    (() => {
      const apiBaseUrl = String(window.ARCADE_LINK_RUNTIME_CONFIG?.apiBaseUrl || '').replace(/\/$/, '');
      const socketScript = document.createElement('script');
      socketScript.src = `${apiBaseUrl}/socket.io/socket.io.js`;
      socketScript.onload = () => import('/app.js');
      socketScript.onerror = () => { document.querySelector('#app').textContent = '플랫폼 서버에 연결하지 못했습니다. 네트워크를 확인한 뒤 다시 시도해 주세요.'; };
      document.head.append(socketScript);
    })();
  </script>
</body>
</html>
